# Highlights and sounds for a new DragonRealms character on Genie 4.
#
#   #highlight {type} {colour} {pattern} {class} {sound}
#
# type is one of: line, string, beginswith, regexp
# sound is a filename in the directory named by #config {sounddir}
#
# Everything here was written against text observed in play rather than
# imagined. Where a line is quoted in a comment, it is a real line off the
# wire.
#
# The rule for whether something gets a SOUND rather than just a colour: a
# sound is for things you need to know about when you are not looking at the
# window. Colour is for finding things once you are. Most entries here are
# colour only, on purpose, because a client that pings constantly is a client
# people mute.
#
# Combat itself fails this test by definition - if you are fighting, you are
# looking at the window, so a wound line does not need a sound to reach you
# the way an idle warning or a whisper does. The wound-severity ladder and
# related combat lines used to carry sound anyway and it turned into exactly
# what the rule above predicts: a fight-long ding on a 3-second clock. Fixed
# 28 Aug 2026 (Dan: "the alerts... way too much... a cacophony of noise") by
# taking the sound back off every combat-frequency entry in the Danger
# section below, keeping only the one wound-class event that is both rare and
# session-ending: character death.
#
# Partly reversed 29 Aug 2026, for a different reason than the one above: the
# fix traded noise for silence on real signal - "you are bleeding",
# "poisoned/parasite attached" and "wound crossed into the dangerous tier"
# are exactly the things a player who muted alerts still wants to hear, and
# deleting them because they retrigger is the same mistake as deleting any
# other information to fix a bad-looking UI. What changed is not the config
# but the client: dr-companion's alertSound.ts now throttles the `wounds`
# class as a whole to one ding per 30 seconds, however many wound-class
# lines match in that window, rather than once per matching line. A file that
# only expresses "on" or "off" per pattern had no way to say "on, but at a
# reminder's pace" - the throttle lives in the client because this file's
# format cannot carry it. See alertSound.ts's own header for the mechanism.

# ---------------------------------------------------------------------------
# Things that cost you the session if you miss them
# ---------------------------------------------------------------------------

# Observed twice in one evening, both times followed by a disconnect:
#
#   [23:54] GENIE HAS FLAGGED YOU AS IDLE, PLEASE RESPOND!
#   > [IDLE TIMER] :quit
#   [23:55] Connection closed.
#
# This is the single highest-value alert in the file. It is the only warning
# before the client quits the game for you, and it scrolls past in a window
# full of arrivals. Loud, and unmissable red.
#
# Sound changed 29 Aug 2026 (Dan: real recordings over a generic pack, mapped
# to what's happening rather than a stock UI blip) - a real close lightning
# crack, not a distant rumble: loud onset for real presence, but it fades
# before fully resolving rather than landing on a clean, satisfied ending -
# your attention drifting off the world, not a completed event.
#highlight {line} {#FF0000} {HAS FLAGGED YOU AS IDLE} {alert} {Thunder.wav}
#highlight {line} {#FF4444} {IDLE TIMER} {alert}

# Disconnects, however they happen.
#highlight {beginswith} {#FF0000} {Connection closed} {alert} {Thunder.wav}

# ---------------------------------------------------------------------------
# Learning, which is what the Experience window is for
# ---------------------------------------------------------------------------

# Observed at login:
#
#   "You are relaxed and your mind has entered a light state of rest. To wake
#    up and start learning again, type: AWAKEN."
#
# A character in this state is not learning. On a layout where Experience gets
# nearly the full height of the screen, silently not learning is the worst
# thing that can quietly be true. Sound, because it can happen while you are
# reading something else.
#
# Sound changed 29 Aug 2026 (Dan) - two real bird calls in quick succession
# (a single chirp read as too quiet/easy to miss - two gives it enough
# duration to actually register as an event), levelled to -18 LUFS like the
# rest of this pass rather than peak-matched, since a short bright call and a
# low rumble read as very different loudness at an identical peak.
#highlight {line} {#FFAA00} {mind has entered a light state of rest} {learning} {Bird.wav}
#highlight {line} {#00FF00} {You are no longer resting} {learning}

# The other half of that pair, observed in a later session:
#
#   "You awaken from your reverie and begin to take in the world around you
#    (You will now begin to gain new experience again)"
#
# A warning without its all-clear is a warning you learn to ignore, because you
# never find out whether the thing you did worked. The parenthesis is the
# game's own confirmation and it is the part worth colouring.
#highlight {string} {#00FF00} {begin to gain new experience again} {learning}

# SEVEN ENTRIES DELETED HERE. They were written for the wrong game.
#
# "clear as a bell / muddled / becoming numbed / numbed / must rest /
# saturated" is the GemStone IV mindstate ladder. It was carried into a
# DragonRealms config, where it fires on nothing: a safety net that is not
# there, in the one category this file exists to cover.
#
# A play session suspected it and correctly refused to delete on the evidence
# it had, because "I never saw it" is an absence you cannot establish from a
# Circle 1 character who never went near a locked skill. That is the right
# call. What was missing was an instrument, and the instrument was on the
# machine the whole time.
#
# Lich ships both ladders, in two different files, and which directory they
# live in is the answer:
#
#   Lich5/lib/dragonrealms/drinfomon/drvariables.rb   DR_LEARNING_RATES,
#                                                     35 states, clear to
#                                                     mind lock
#   Lich5/lib/constants.rb                            MINDMAP, 8 states,
#                                                     clear as a bell to
#                                                     saturated
#
# "muddled", "numbed" and "saturated" appear only in the second. They are not
# in DragonRealms' ladder at all. Run this and read the two lists:
#
#   grep -rn "muddled" C:/Ruby4Lich5/Lich5/lib/
#   sed -n '1,45p' C:/Ruby4Lich5/Lich5/lib/dragonrealms/drinfomon/drvariables.rb
#
# The check outlives this note: validate.mjs reads DR_LEARNING_RATES off disk
# and fails if any mindstate here is absent from it, or if any state in it is
# uncovered here. If Lich is not installed it says NOT CHECKED and why, rather
# than passing quietly.

# The mindstate ladder DragonRealms actually prints, in the EXP window.
#
# Observed:
#
#   "     Performance:      5 07% perusing       (2/34)"
#
# Anchored on the percentage that precedes it, because half these words are
# ordinary English - "learning", "focused", "interested" - and unanchored they
# would fire on conversation, room descriptions and this file's own help text.
# The number is what makes the line an experience row rather than prose.
#
# All 35 states, in three bands. The first version of this covered 27 and the
# gaps were invisible until the list was diffed against Lich's: "clear",
# "thinking", "considering", "ruminating", and every one of the four "very"
# states, which do not match a bare alternative because the anchor puts "very"
# immediately after the percentage. Hence "(?:very )?" rather than listing them
# twice.
#
# No sound on any of them. EXP is displayed constantly and a skill list that
# pings once per row is the fastest way to get the whole file muted.
#highlight {regexp} {#7FB069} {[0-9]% (clear|dabbling|perusing|learning|thoughtful|thinking|considering|pondering|ruminating|concentrating|attentive|deliberative|interested)} {learning}
#highlight {regexp} {#D99A3C} {[0-9]% (examining|understanding|absorbing|intrigued|scrutinizing|analyzing|studious|(?:very )?focused|(?:very )?engaged|cogitating|fascinated)} {learning}
#highlight {regexp} {#D2635A} {[0-9]% (captivated|engrossed|(?:very )?riveted|(?:very )?rapt|enthralled|nearly locked|mind lock)} {learning}

# ---------------------------------------------------------------------------
# Training that is not combat
# ---------------------------------------------------------------------------
#
# A Bard trains Performance standing in a town street with an instrument out
# of their own pack, and none of it looks like fighting. Observed playing
# Phemius, a Circle 1 Kaldar Bard.
#
# This one is the most valuable line in the section, because nothing else in
# the game says it:
#
#   "The armor on your head makes playing your cocobolo txistu more
#    difficult."
#
# A helm degrades wind-instrument play. There is no message when you take it
# off and no penalty listed anywhere - you either catch this line or you train
# slower for as long as you own a hat.
#
# Sound changed 29 Aug 2026 (Dan) - a real harp pluck, edited: clean attack,
# then choked mid-ring with a fast lowpass sweep and a volume drop, the way a
# gloved hand closing over a string would actually sound. The concept is the
# note itself getting interfered with, not a notification about it.
#highlight {string} {#FFAA00} {makes playing your} {learning} {HarpChoked.wav}

# The song started, and the song is still going. PLAY is continuous: asking
# again while one runs gives the second line and does nothing, which is what
# makes a timed re-poke a safe way to keep a practice loop alive.
#highlight {regexp} {#66DDFF} {^You begin .* on your } {learning}
#highlight {string} {#8899AA} {already playing a song} {learning}

# Experience gained at all.
#highlight {line} {#00FF88} {You feel more experienced} {learning}

# ---------------------------------------------------------------------------
# People
# ---------------------------------------------------------------------------
#
# Not gagged, deliberately. Arrivals look like noise and are not: knowing who
# is in the room is most of what a MUD is, and the person who just walked in
# might be a GM. The point of highlighting them is that they stop scrolling
# past unread.
#
# Observed forms, which are more varied than a naive pattern expects:
#
#   Heartbreaker Zarif just arrived.
#   Doom's Whisper Mazzick runs east.
#   Togballer Bulvine swaggers east.
#   Travelling Doctor Marconias goes west.
#   Idiot Savant Warwik just arrived.
#
# The movement verb is per-player flavour, so matching on "leaves" alone would
# miss most departures. Arrival is the reliable one.
#
# It had a sound. Ninety seconds of standing in Firulf Vista took that back:
# nine arrivals and nine departures, one every five seconds, and every single
# one of them reprinting the room block underneath. A crossroads in the
# Crossing is where players actually stand, and a sound on arrival there is a
# chime every five seconds until somebody mutes the client - at which point
# they have no alerts at all, including the idle warning that costs a session.
#
# The reasoning that put a sound here was that the person walking in might be a
# GM. That is a real argument and it argues for the colour, which is still
# here. It does not argue for waking you up, because a GM in the room is
# something you find by looking at a window you are already looking at.
#highlight {line} {#66DDFF} {just arrived} {people}

# Departures were eight lines of verb-plus-direction: runs east, runs west,
# goes north, and so on. That was already the second attempt - the first
# matched "leaves" and caught almost nothing - and it was still wrong, because
# the verb is unbounded. One evening produced:
#
#   Doom's Whisper Mazzick runs east.
#   Togballer Bulvine swaggers east.
#   Travelling Doctor Marconias goes west.
#   Commoner Brommoner hobbles east.
#
# Enumerating verbs cannot finish. The direction can: there are ten of them and
# the game will not invent an eleventh. So the direction at the end of the line
# is the thing matched, and the verb is left alone.
#
# One regexp where there were eight literals. Genie is .NET, so this is .NET
# regex - non-capturing groups and anchors are fine. It also picks up your own
# movement, which is correct: your departure is a departure.
#highlight {regexp} {#4499BB} { (?:east|west|north|south|northeast|northwest|southeast|southwest|up|down)\.$} {people}

# Vertical movement does not name a direction at all. Observed:
#
#   Commoner Brommoner came down a stone stairway.
#
# Which the direction match above cannot see, because the line ends in the
# furniture rather than the way.
#highlight {string} {#4499BB} {a stone stairway} {people}
#highlight {string} {#4499BB} {climbs up} {people}
#highlight {string} {#4499BB} {climbs down} {people}

# Also here: is how the room tells you who is standing with you.
#highlight {line} {#88CCFF} {Also here:} {people}

# Someone wearing a visible effect. Observed in one ninety-second stretch:
#
#   Also here: Serial Killer Damiza who is surrounded by a purple cloud of glitter.
#   Also here: Silvyandril who is blurred by hazy afterimages.
#
# These trail off the "Also here:" line and mark a player carrying something
# unusual - a spell up, a premium item, occasionally a GM. Worth seeing on a
# line you are already reading. Not worth a sound, for the same reason
# arrivals are not.
#highlight {string} {#C9A0DC} {who is surrounded by} {people}
#highlight {string} {#C9A0DC} {who is blurred by} {people}

# ---------------------------------------------------------------------------
# The room block, which is most of what scrolls past
# ---------------------------------------------------------------------------
#
# Every arrival and every departure reprints the whole thing. Measured in
# Firulf Vista: eighteen movement events in ninety seconds, each one followed
# by three or four lines of room. That is roughly sixty lines a minute of text
# describing a room that has not changed, and it is what buries the two or
# three lines an evening that actually matter.
#
# Not gagged. The room block is how you know where you are, and a player who
# has just walked somewhere is reading it deliberately. But it is dimmed hard,
# so a page of it reads as background and anything coloured on top of it is
# visible through it at a glance.
#highlight {beginswith} {#5C7A99} {You also see} {room}
#highlight {beginswith} {#5C7A99} {Obvious paths:} {room}
#highlight {beginswith} {#5C7A99} {Obvious exits:} {room}

# Something walked in that is not a person. Observed:
#
#   You notice as a black lynx pads into the area.
#
# This one does get a sound, and the contrast with arrivals is the whole
# policy in one place. A player walking in is information. A creature walking
# in is a thing that can attack you while you are reading something else in
# another window, which is the definition of what a sound is for here.
#
# Matched on "into the area" rather than on a verb: the creature's movement
# verb is per-creature flavour in exactly the way the player one is, and
# "pads" would catch lynxes and nothing else. A second play session confirmed
# the shape holds across creatures:
#
#   A shaggy mutt bounds into the area.
#   You notice as a black lynx pads into the area.
#
# Two verbs, one phrase, and the phrase is what is matched.
#
# Sound changed 29 Aug 2026 (Dan) - a real growl, tagged by its own recordist
# as a fantasy creature, not a person. Not magic, not a notification: an
# animal's own sound, the way the thing itself would actually announce
# itself. Also frees this from sharing a sound with character death below,
# which used to mean "something walked in" and "you died" were
# indistinguishable by ear.
#highlight {string} {#FF8800} {into the area} {danger} {Growl.wav}

# Not everything that walks in says "into the area". Observed:
#
#   A town guard walks in, glancing about with a false look of boredom on his face.
#
# The comma matters. Bare "walks in" would fire on any sentence containing the
# words; the entering form always continues into a clause describing what it
# does on arrival. Same sound, because a thing that entered the room is a thing
# that entered the room regardless of which phrasing the game reached for.
#highlight {string} {#FF8800} { walks in,} {danger} {Growl.wav}

# Creatures leaving. Observed:
#
#   The black lynx pads off.
#
# Colour only. A creature arriving can act on you while you are looking
# elsewhere, which is what a sound is for; a creature leaving is the opposite
# of that, and it is still worth seeing because it answers "is the thing I was
# fighting still here".
#
# Matched on the trailing "off." rather than the verb, for the third time in
# this file and for the same reason: pads, lopes, slinks, scampers, and one
# more next session.
#highlight {regexp} {#CC9955} { off\.$} {danger}

# Something nearby just died. Observed, tagged as its own `death` stream:
#
#   * Someone was just struck down!
#
# Same category as a creature entering: it changes what is in the room enough
# to be worth a colour rather than scrolling past unmarked. No sound, though -
# reversed 28 Aug 2026 (Dan: "the alerts... way too much... a cacophony of
# noise"), because during any real hunt this fires as often as the fight
# itself does, unlike a creature *arriving*, which is the rare, ambush-risk
# event a sound is actually for. Something dying is the fight going well, not
# a thing you were not already watching.
#highlight {string} {#FF6666} {was just struck down} {danger}

# Someone paying attention to the room you are in. Observed:
#   "Desiphon studies the area intently."
#highlight {line} {#FFFF00} {studies the area intently} {people}

# Anything addressed to you personally. These get sound because they are a
# person waiting for an answer.
#highlight {line} {#FFFF88} {whispers} {speech} {Whisper.wav}
#highlight {line} {#FFFF88} {tells you} {speech} {Speech.wav}
#highlight {line} {#FFFF88} {thinks to you} {speech} {Speech.wav}

# ---------------------------------------------------------------------------
# Danger
# ---------------------------------------------------------------------------

# Bleeding and stun used to carry Hit.wav, then lost it 28 Aug 2026 for
# retriggering every exchange of a real fight.
#
# Bleeding got it back 29 Aug 2026, on the client-side class-throttle
# described at the top of this file rather than on the old flat 3-second
# floor - "you are bleeding" is exactly the kind of thing a player who muted
# alerts still needs to hear, and it now dings at most once per 30 seconds
# regardless of how many wounds-class lines fire in that window. Stun stays
# colour-only: shorter-lived, always paired with a line you're already
# reading mid-exchange, and less clearly worth its share of that 30-second
# window than bleeding or a dangerous wound.
#highlight {line} {#FF0000} {You are bleeding} {wounds} {Hit.wav}
#highlight {line} {#FF0000} {You are stunned} {wounds}

# Character death is the one exception in this whole section that keeps its
# sound - rare (does not happen every fight, or most), and the one wound-class
# event that can end a session outright if missed.
#
# Sound changed 29 Aug 2026 (Dan: "death should be a death sound and not
# wings or something") - a real recording of a body falling, kept quiet
# rather than dramatic. Direct rather than a metaphor: the established
# community Genie sound scheme for this exact event names its own file
# `Body.wav` for the same reason, though it carries no stated license and was
# not used here - this is a separately-sourced, properly-licensed (CC0)
# equivalent, not a copy.
#highlight {beginswith} {#FF0000} {You are a ghost} {wounds} {BodyFall.wav}
#highlight {line} {#FF6666} {is bleeding} {wounds}
#highlight {line} {#FFAA00} {You feel a bit tired} {wounds}

# The wound severity ladder, which used to be one bare word out of thirteen.
#
# This section previously carried `#highlight {line} {#FF0000} {severe}` and
# nothing else from the scale. Two things wrong with that, and the second is
# the one that matters:
#
#   - It matched "severe" anywhere, so it reddened "severe scarring", "severely
#     swollen" and any sentence containing the word. A colour that fires on
#     prose stops meaning anything.
#   - It covered ONE of thirteen severities, and not the top. A character with
#     a "devastating" or "useless" limb got no colour at all, while one with a
#     scar got red. The scale ran the wrong way at the dangerous end.
#
# Same defect as the mindstates and found the same way: Lich has to parse this,
# so Lich knows the vocabulary. DRCH::WOUND_SEVERITY in
# lib/dragonrealms/commons/common-healing-data.rb is the full thirteen, and the
# constant beside it documents the line they appear in with a worked example:
#
#   PERCEIVE_HEALTH_SEVERITY_REGEX
#   "For example, the 'negligible' in
#    'Fresh External:  light scratches -- negligible'"
#
# So the anchor is the "--" that precedes the severity in PERCEIVE HEALTH
# SELF, which is what keeps "minor" and "harmful" from firing on ordinary
# sentences. Written as "-- *" rather than a backslash-s class, because on this
# machine an escape written through the wrong tool arrives halved and a regexp
# that compiles while matching nothing is the exact failure this file exists to
# prevent.
#
# validate.mjs reads WOUND_SEVERITY off disk and checks both directions, so if
# Simutronics adds a fourteenth level this file will say so.
#highlight {regexp} {#7FB069} {-- *(insignificant|negligible)} {wounds}
#highlight {regexp} {#D99A3C} {-- *(minor|more than minor|harmful|very harmful)} {wounds}
#highlight {regexp} {#FF6600} {-- *(damaging|very damaging)} {wounds}
# The top of the ladder used to carry Hit.wav too, then lost it 28 Aug 2026
# for the same repeated-HEALTH-check reason as bleeding above - and got it
# back 29 Aug 2026 on the same class throttle: a HEALTH-checking script
# re-reading "severe" ten times in a fight still dings at most once per 30
# seconds, not ten times. This is the actual "being struck" alert the wounds
# channel exists for - the wound crossing into the tier where it costs the
# fight if you don't act on it.
#highlight {regexp} {#FF0000} {-- *(severe|very severe|devastating|very devastating|useless)} {wounds} {Hit.wav}

# Something is stuck in you, and it keeps hurting until it comes out.
#
# Lich matches these as `lodged .* into your <part>`, and grades the depth
# loosely hanging / shallowly / firmly / deeply / savagely. The item does not
# announce itself again after the blow that put it there, so this is a line you
# either catch in HEALTH or forget about while it bleeds you.
#
# Lost its sound 28 Aug 2026 for the same reason as the rest of this
# section, and got it back 29 Aug 2026 on the class throttle - a fight where
# something lodges more than one item still dings at most once per 30
# seconds, and this is exactly the "you either catch this line or forget
# about it" case the sound is for.
#highlight {regexp} {#FF0000} {lodged .* into your} {wounds} {Hit.wav}

# Parasites, straight out of Lich's PARASITES_REGEX. They attach and drain,
# and they are easy to miss on a HEALTH readout because they are not wounds
# and do not appear with the rest of the damage - closest thing this game has
# to "poisoned" in the sense a player means it. Lost its sound 28 Aug 2026,
# same reasoning as the rest of this section, and got it back 29 Aug 2026 on
# the class throttle. Reuses Hit.wav rather than a dedicated recording - this
# is still "something is hurting you" the same as bleeding and a bad wound,
# not an unrelated meaning riding along on a generic blip, which is the
# distinction the 29 Aug sound-remapping pass above (Growl.wav, BodyFall.wav,
# etc.) drew a hard line on. A parasite-specific recording (attachment,
# feeding, something with texture to it) would be a better fit than a reused
# impact sound and is worth sourcing properly rather than forcing a
# mismatched file onto this slot to have *a* sound.
#highlight {regexp} {#FF3300} {(blood mite|sand leech|forest leech|blood worm|retch maggot)} {wounds} {Hit.wav}

# Roundtime is why nothing is happening. Worth seeing, never worth a sound.
#highlight {line} {#888888} {Roundtime} {rt}
#highlight {line} {#AAAAAA} {...wait} {rt}
#highlight {line} {#FFAA00} {you may only type ahead} {rt}

