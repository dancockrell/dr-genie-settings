# Highlights and sounds for a new DragonRealms character on Genie 4.
#
#   #highlight {type} {colour} {pattern} {class} {sound}
#
# type is one of: line, string, beginswith, regexp
# sound is a filename in the directory named by #config {sounddir}
#
# Everything here was written against text observed in play rather than
# imagined. Where a line is quoted in a comment, it is a real line off the
# wire.
#
# The rule for whether something gets a SOUND rather than just a colour: a
# sound is for things you need to know about when you are not looking at the
# window. Colour is for finding things once you are. Most entries here are
# colour only, on purpose, because a client that pings constantly is a client
# people mute.

# ---------------------------------------------------------------------------
# Things that cost you the session if you miss them
# ---------------------------------------------------------------------------

# Observed twice in one evening, both times followed by a disconnect:
#
#   [23:54] GENIE HAS FLAGGED YOU AS IDLE, PLEASE RESPOND!
#   > [IDLE TIMER] :quit
#   [23:55] Connection closed.
#
# This is the single highest-value alert in the file. It is the only warning
# before the client quits the game for you, and it scrolls past in a window
# full of arrivals. Loud, and unmissable red.
#highlight {line} {#FF0000} {HAS FLAGGED YOU AS IDLE} {alert} {Help.wav}
#highlight {line} {#FF4444} {IDLE TIMER} {alert}

# Disconnects, however they happen.
#highlight {beginswith} {#FF0000} {Connection closed} {alert} {Help.wav}

# ---------------------------------------------------------------------------
# Learning, which is what the Experience window is for
# ---------------------------------------------------------------------------

# Observed at login:
#
#   "You are relaxed and your mind has entered a light state of rest. To wake
#    up and start learning again, type: AWAKEN."
#
# A character in this state is not learning. On a layout where Experience gets
# nearly the full height of the screen, silently not learning is the worst
# thing that can quietly be true. Sound, because it can happen while you are
# reading something else.
#highlight {line} {#FFAA00} {mind has entered a light state of rest} {learning} {Help.wav}
#highlight {line} {#00FF00} {You are no longer resting} {learning}

# The other half of that pair, observed in a later session:
#
#   "You awaken from your reverie and begin to take in the world around you
#    (You will now begin to gain new experience again)"
#
# A warning without its all-clear is a warning you learn to ignore, because you
# never find out whether the thing you did worked. The parenthesis is the
# game's own confirmation and it is the part worth colouring.
#highlight {string} {#00FF00} {begin to gain new experience again} {learning}

# SUSPECT, AND LEFT IN ON PURPOSE UNTIL SOMEBODY CAN CHECK IN GAME.
#
# "clear / muddled / numbed / saturated" is the GemStone IV mindstate ladder.
# DragonRealms uses a different one entirely, and the EXP window observed on
# 27 Aug 2026 proves it:
#
#   "     Performance:      5 07% perusing       (2/34)"
#   "Overall state of mind: clear"
#
# "perusing" is a DragonRealms mindstate. "muddled" and "numbed" are not words
# this game produced in an evening of play. So these seven probably fire on
# nothing, which makes them the worst kind of entry: a safety net that is not
# there, in the one class the file exists to cover.
#
# They are not deleted because "I never saw it" is an absence I could not
# establish - the character was Circle 1 and never came near a locked skill,
# so no test tonight could have produced these lines whether they exist or
# not. Deleting on that evidence would be guessing in the other direction.
# Whoever next has a skill at mind lock: watch what the game actually says,
# then delete this block or the note above it.
#highlight {line} {#FF8800} {is quite clear} {learning}
#highlight {line} {#FFCC00} {becoming muddled} {learning}
#highlight {line} {#FF6600} {is muddled} {learning}
#highlight {line} {#FF3300} {becoming numbed} {learning}
#highlight {line} {#FF0000} {is numbed} {learning} {Help.wav}
#highlight {line} {#FF0000} {is becoming saturated} {learning}
#highlight {line} {#FF0000} {is saturated} {learning} {Help.wav}

# The mindstate ladder DragonRealms actually prints, in the EXP window.
#
# Anchored on the percentage that precedes it, because half these words are
# ordinary English - "learning", "focused", "interested" - and unanchored they
# would fire on conversation, room descriptions and this file's own help text.
# The number is what makes the line an experience row rather than prose.
#
# No sound on any of them. EXP is displayed constantly and a skill list that
# pings once per row is the fastest way to get the whole file muted.
#highlight {regexp} {#7FB069} {[0-9]% (dabbling|perusing|learning|thoughtful|pondering|concentrating|attentive|deliberative|interested|examining)} {learning}
#highlight {regexp} {#D99A3C} {[0-9]% (understanding|absorbing|intrigued|scrutinizing|analyzing|studious|focused|engaged|cogitating|fascinated)} {learning}
#highlight {regexp} {#D2635A} {[0-9]% (captivated|engrossed|riveted|rapt|enthralled|nearly locked|mind lock)} {learning}

# ---------------------------------------------------------------------------
# Training that is not combat
# ---------------------------------------------------------------------------
#
# A Bard trains Performance standing in a town street with an instrument out
# of their own pack, and none of it looks like fighting. Observed playing
# Phemius, a Circle 1 Kaldar Bard.
#
# This one is the most valuable line in the section, because nothing else in
# the game says it:
#
#   "The armor on your head makes playing your cocobolo txistu more
#    difficult."
#
# A helm degrades wind-instrument play. There is no message when you take it
# off and no penalty listed anywhere - you either catch this line or you train
# slower for as long as you own a hat.
#highlight {string} {#FFAA00} {makes playing your} {learning} {Help.wav}

# The song started, and the song is still going. PLAY is continuous: asking
# again while one runs gives the second line and does nothing, which is what
# makes a timed re-poke a safe way to keep a practice loop alive.
#highlight {regexp} {#66DDFF} {^You begin .* on your } {learning}
#highlight {string} {#8899AA} {already playing a song} {learning}

# Experience gained at all.
#highlight {line} {#00FF88} {You feel more experienced} {learning}

# ---------------------------------------------------------------------------
# People
# ---------------------------------------------------------------------------
#
# Not gagged, deliberately. Arrivals look like noise and are not: knowing who
# is in the room is most of what a MUD is, and the person who just walked in
# might be a GM. The point of highlighting them is that they stop scrolling
# past unread.
#
# Observed forms, which are more varied than a naive pattern expects:
#
#   Heartbreaker Zarif just arrived.
#   Doom's Whisper Mazzick runs east.
#   Togballer Bulvine swaggers east.
#   Travelling Doctor Marconias goes west.
#   Idiot Savant Warwik just arrived.
#
# The movement verb is per-player flavour, so matching on "leaves" alone would
# miss most departures. Arrival is the reliable one.
#
# It had a sound. Ninety seconds of standing in Firulf Vista took that back:
# nine arrivals and nine departures, one every five seconds, and every single
# one of them reprinting the room block underneath. A crossroads in the
# Crossing is where players actually stand, and a sound on arrival there is a
# chime every five seconds until somebody mutes the client - at which point
# they have no alerts at all, including the idle warning that costs a session.
#
# The reasoning that put a sound here was that the person walking in might be a
# GM. That is a real argument and it argues for the colour, which is still
# here. It does not argue for waking you up, because a GM in the room is
# something you find by looking at a window you are already looking at.
#highlight {line} {#66DDFF} {just arrived} {people}

# Departures were eight lines of verb-plus-direction: runs east, runs west,
# goes north, and so on. That was already the second attempt - the first
# matched "leaves" and caught almost nothing - and it was still wrong, because
# the verb is unbounded. One evening produced:
#
#   Doom's Whisper Mazzick runs east.
#   Togballer Bulvine swaggers east.
#   Travelling Doctor Marconias goes west.
#   Commoner Brommoner hobbles east.
#
# Enumerating verbs cannot finish. The direction can: there are ten of them and
# the game will not invent an eleventh. So the direction at the end of the line
# is the thing matched, and the verb is left alone.
#
# One regexp where there were eight literals. Genie is .NET, so this is .NET
# regex - non-capturing groups and anchors are fine. It also picks up your own
# movement, which is correct: your departure is a departure.
#highlight {regexp} {#4499BB} { (?:east|west|north|south|northeast|northwest|southeast|southwest|up|down)\.$} {people}

# Vertical movement does not name a direction at all. Observed:
#
#   Commoner Brommoner came down a stone stairway.
#
# Which the direction match above cannot see, because the line ends in the
# furniture rather than the way.
#highlight {string} {#4499BB} {a stone stairway} {people}
#highlight {string} {#4499BB} {climbs up} {people}
#highlight {string} {#4499BB} {climbs down} {people}

# Also here: is how the room tells you who is standing with you.
#highlight {line} {#88CCFF} {Also here:} {people}

# Someone wearing a visible effect. Observed in one ninety-second stretch:
#
#   Also here: Serial Killer Damiza who is surrounded by a purple cloud of glitter.
#   Also here: Silvyandril who is blurred by hazy afterimages.
#
# These trail off the "Also here:" line and mark a player carrying something
# unusual - a spell up, a premium item, occasionally a GM. Worth seeing on a
# line you are already reading. Not worth a sound, for the same reason
# arrivals are not.
#highlight {string} {#C9A0DC} {who is surrounded by} {people}
#highlight {string} {#C9A0DC} {who is blurred by} {people}

# ---------------------------------------------------------------------------
# The room block, which is most of what scrolls past
# ---------------------------------------------------------------------------
#
# Every arrival and every departure reprints the whole thing. Measured in
# Firulf Vista: eighteen movement events in ninety seconds, each one followed
# by three or four lines of room. That is roughly sixty lines a minute of text
# describing a room that has not changed, and it is what buries the two or
# three lines an evening that actually matter.
#
# Not gagged. The room block is how you know where you are, and a player who
# has just walked somewhere is reading it deliberately. But it is dimmed hard,
# so a page of it reads as background and anything coloured on top of it is
# visible through it at a glance.
#highlight {beginswith} {#5C7A99} {You also see} {room}
#highlight {beginswith} {#5C7A99} {Obvious paths:} {room}
#highlight {beginswith} {#5C7A99} {Obvious exits:} {room}

# Something walked in that is not a person. Observed:
#
#   You notice as a black lynx pads into the area.
#
# This one does get a sound, and the contrast with arrivals is the whole
# policy in one place. A player walking in is information. A creature walking
# in is a thing that can attack you while you are reading something else in
# another window, which is the definition of what a sound is for here.
#
# Matched on "into the area" rather than on a verb: the creature's movement
# verb is per-creature flavour in exactly the way the player one is, and
# "pads" would catch lynxes and nothing else. A second play session confirmed
# the shape holds across creatures:
#
#   A shaggy mutt bounds into the area.
#   You notice as a black lynx pads into the area.
#
# Two verbs, one phrase, and the phrase is what is matched.
#highlight {string} {#FF8800} {into the area} {danger} {Spooky.wav}

# Not everything that walks in says "into the area". Observed:
#
#   A town guard walks in, glancing about with a false look of boredom on his face.
#
# The comma matters. Bare "walks in" would fire on any sentence containing the
# words; the entering form always continues into a clause describing what it
# does on arrival. Same sound, because a thing that entered the room is a thing
# that entered the room regardless of which phrasing the game reached for.
#highlight {string} {#FF8800} { walks in,} {danger} {Spooky.wav}

# Creatures leaving. Observed:
#
#   The black lynx pads off.
#
# Colour only. A creature arriving can act on you while you are looking
# elsewhere, which is what a sound is for; a creature leaving is the opposite
# of that, and it is still worth seeing because it answers "is the thing I was
# fighting still here".
#
# Matched on the trailing "off." rather than the verb, for the third time in
# this file and for the same reason: pads, lopes, slinks, scampers, and one
# more next session.
#highlight {regexp} {#CC9955} { off\.$} {danger}

# Someone paying attention to the room you are in. Observed:
#   "Desiphon studies the area intently."
#highlight {line} {#FFFF00} {studies the area intently} {people}

# Anything addressed to you personally. These get sound because they are a
# person waiting for an answer.
#highlight {line} {#FFFF88} {whispers} {speech} {Whisper.wav}
#highlight {line} {#FFFF88} {tells you} {speech} {Speech.wav}
#highlight {line} {#FFFF88} {thinks to you} {speech} {Speech.wav}

# ---------------------------------------------------------------------------
# Danger
# ---------------------------------------------------------------------------

#highlight {line} {#FF0000} {You are bleeding} {wounds} {Hit.wav}
#highlight {line} {#FF0000} {You are stunned} {wounds} {Hit.wav}
#highlight {beginswith} {#FF0000} {You are a ghost} {wounds} {Spooky.wav}
#highlight {line} {#FF6666} {is bleeding} {wounds}
#highlight {line} {#FF0000} {severe} {wounds}
#highlight {line} {#FFAA00} {You feel a bit tired} {wounds}

# Roundtime is why nothing is happening. Worth seeing, never worth a sound.
#highlight {line} {#888888} {Roundtime} {rt}
#highlight {line} {#AAAAAA} {...wait} {rt}
#highlight {line} {#FFAA00} {you may only type ahead} {rt}

# ---------------------------------------------------------------------------
# Magic
# ---------------------------------------------------------------------------
#
# Observed repeatedly, several times a minute:
#   "You feel fully attuned to the mana streams again."
#
# Colour only. It is useful to see and far too frequent to hear.
#highlight {line} {#7799FF} {attuned to the mana streams} {magic}
#highlight {line} {#9977FF} {Your spell is ready} {magic}
#highlight {line} {#FF7777} {Your spell fizzles} {magic}
#highlight {line} {#FF7777} {You lose your concentration} {magic}

