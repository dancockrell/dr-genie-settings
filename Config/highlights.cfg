# Money and things
# ---------------------------------------------------------------------------

#highlight {line} {#FFD700} {Kronar} {money}
#highlight {line} {#FFD700} {Lirum} {money}
#highlight {line} {#FFD700} {Dokora} {money}
# The character-creation debt, which every new character has and almost none of
# them notice. Observed on Phemius at Circle 1:
#
#   Owes 1146 copper Kronars to the Principality of Zoluren
#
# It appears in WEALTH and in INFO and nowhere a new player is looking. Amber
# rather than gold, because it is the one number in this section that is not
# yours.
#highlight {string} {#FFAA00} {Owes} {money}
#highlight {string} {#FFAA00} {to the Principality of} {money}

#highlight {line} {#00FF00} {You pick up} {items}
#highlight {line} {#FF8800} {You are unable to pick} {items}
#highlight {line} {#FF8800} {both hands are full} {items}
